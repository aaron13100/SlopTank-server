name: Public CI
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  SDK_VERSION: "10.0.x"

jobs:
  validate-public-product:
    name: Build, format, and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify NuGet package publication stays disabled
        run: python3 scripts/check-package-publication.py

      - name: Verify public product identity
        run: python3 scripts/check-product-identity.py

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore product dependencies
        run: dotnet restore Jellyfin.Server/Jellyfin.Server.csproj

      - name: Verify formatting
        run: dotnet format Jellyfin.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build and type-check product
        run: dotnet build Jellyfin.Server/Jellyfin.Server.csproj --configuration Release --no-restore

      - name: Smoke test the public CLI
        shell: bash
        run: |
          set +e
          help_output="$(dotnet run --project Jellyfin.Server/Jellyfin.Server.csproj --configuration Release --no-build -- --help 2>&1)"
          help_status=$?
          set -e
          printf '%s\n' "$help_output"
          test "$help_status" -eq 1
          grep -F -- '--datadir' <<< "$help_output"
          grep -F -- '--nowebclient' <<< "$help_output"
