# SlopTank modification notice: added or changed by SlopTank on 2026-11-05, 2026-11-06.
name: FFmpeg teletext subtitles

on:
  push:
    branches: [release-ffmpeg]
    paths:
      - apps/macos/ffmpeg-zvbi-subtitles-only.patch
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build; use x86_64 for the Intel retry
        type: choice
        options: [both, x86_64, arm64]
        default: both
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} FFmpeg
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'x86_64' && '["x86_64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["x86_64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: ${{ matrix.arch == 'x86_64' && 240 || 120 }}
    env:
      FF_SOURCE_COMMIT: 7250de8375a4959ac1c25c139ce9789fdac199fb
      ZVBI_COMMIT: 41477c97c8edf7a01f1594b2a95b94f0117eed21
      TELE_TEXT_SAMPLE: https://samples.ffmpeg.org/ffmpeg-bugs/trac/ticket2086/teletextsubtitles.ts
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch == 'x86_64' && 'mac64' || 'macarm64' }}
      ORIGINAL_ARCHIVE: ${{ matrix.arch == 'x86_64' && 'jellyfin-ffmpeg_8.1.3-2_portable_mac64-gpl.tar.xz' || 'jellyfin-ffmpeg_8.1.3-2_portable_macarm64-gpl.tar.xz' }}
      ORIGINAL_SHA256: ${{ matrix.arch == 'x86_64' && 'd394180f1155f84857544a48a99869f5741ccc50c5a1f73d2797429a2b326448' || 'd898cc819e7c4e9219d6410ddbdaada0838f14bec6ff89e283639915394cb43f' }}
      HOMEBREW_CORE_COMMIT: e2db8893cd5562c559c91543e9dbf9b30156bf3b
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        if: matrix.arch == 'arm64'
        uses: Homebrew/actions/setup-homebrew@2026.09.13.1
      - name: Verify runner and prepare build prefix
        run: |
          test "$(uname -m)" = "$ARCH"
          sw_vers
          sudo mkdir -p /opt/ffbuild
          sudo chmod 777 /opt/ffbuild
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/output/sources/dependencies"
      - name: Prepare pinned Intel Homebrew tools
        if: matrix.arch == 'x86_64'
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          test "$(brew --version | head -n 1)" = 'Homebrew 6.0.18'
          core="$(brew --repo homebrew/core)"
          test -d "$core/.git"
          git -C "$core" fetch --depth=1 origin "$HOMEBREW_CORE_COMMIT"
          git -C "$core" checkout --detach "$HOMEBREW_CORE_COMMIT"
          test "$(git -C "$core" rev-parse HEAD)" = "$HOMEBREW_CORE_COMMIT"
          formulae=(wget subversion autoconf automake cmake meson ninja pkg-config coreutils make python-setuptools pcre2 libtool gnu-sed gnu-tar nasm quilt texinfo)
          {
            printf 'HOMEBREW_NO_AUTO_UPDATE=1\nHOMEBREW_NO_INSTALL_FROM_API=1\nHOMEBREW_NO_INSTALL_UPGRADE=1\n'
            printf 'homebrew_version=%s\ncore_commit=%s\n' "$(brew --version | head -n 1)" "$HOMEBREW_CORE_COMMIT"
            for formula in "${formulae[@]}"; do
              brew list --versions "$formula" || true
            done
          } > "$RUNNER_TEMP/output/homebrew-before.txt"
          brew install --force-bottle --formula "${formulae[@]}"
          brew info --json=v2 "${formulae[@]}" > "$RUNNER_TEMP/output/homebrew-formula-info.json"
          {
            printf 'HOMEBREW_NO_AUTO_UPDATE=1\nHOMEBREW_NO_INSTALL_FROM_API=1\nHOMEBREW_NO_INSTALL_UPGRADE=1\n'
            printf 'homebrew_version=%s\ncore_commit=%s\ncore_path=%s\n' \
              "$(brew --version | head -n 1)" "$(git -C "$core" rev-parse HEAD)" "$core"
            brew list --versions "${formulae[@]}"
            for tool in wget svn autoconf automake cmake meson ninja pkg-config nproc make python3 glibtoolize sed gsed gtar nasm quilt makeinfo cp install mkdir rm mv tar xargs stat readlink mktemp; do
              printf '%s\t%s\n' "$tool" "$(command -v "$tool" || true)"
            done
          } > "$RUNNER_TEMP/output/homebrew-after.txt"
          shasum -a 256 "$RUNNER_TEMP/output/homebrew-before.txt" \
            "$RUNNER_TEMP/output/homebrew-formula-info.json" \
            "$RUNNER_TEMP/output/homebrew-after.txt" > "$RUNNER_TEMP/output/homebrew-facts.sha256"
      - name: Fetch pinned Jellyfin source, original package, and teletext fixture
        run: |
          mkdir -p "$RUNNER_TEMP/jellyfin-ffmpeg"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" init
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" remote add origin https://github.com/jellyfin/jellyfin-ffmpeg.git
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" fetch --depth=1 origin "$FF_SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/jellyfin-ffmpeg" rev-parse HEAD)" = "$FF_SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" archive --format=tar.gz --prefix=jellyfin-ffmpeg/ HEAD > "$RUNNER_TEMP/output/sources/jellyfin-ffmpeg-v8.1.3-2.tar.gz"
          tar -czf "$RUNNER_TEMP/output/sources/ffmpeg-builder-recipes.tar.gz" \
            --exclude='builder/build/*' --exclude='builder/artifacts/*' --exclude='.git' \
            -C "$RUNNER_TEMP/jellyfin-ffmpeg" builder debian/changelog debian/patches
          cp .github/workflows/ffmpeg-subtitles.yml "$RUNNER_TEMP/output/sources/ffmpeg-subtitles.yml"
          WORKFLOW_SHA256="$(shasum -a 256 "$RUNNER_TEMP/output/sources/ffmpeg-subtitles.yml" | awk '{print $1}')"
          MACOS_DEPS_PATCH_SHA256="$(shasum -a 256 apps/macos/ffmpeg-macos-no-gcc.patch | awk '{print $1}')"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" show "$FF_SOURCE_COMMIT:.github/workflows/_meta_mac_portable.yaml" \
            > "$RUNNER_TEMP/output/sources/upstream-meta-mac-portable.yaml"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" show "$FF_SOURCE_COMMIT:builder/Buildmac.md" \
            > "$RUNNER_TEMP/output/sources/Buildmac.md"
          curl --fail --location --retry 2 --max-time 180 \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-2/$ORIGINAL_ARCHIVE" \
            -o "$RUNNER_TEMP/$ORIGINAL_ARCHIVE"
          printf '%s  %s\n' "$ORIGINAL_SHA256" "$RUNNER_TEMP/$ORIGINAL_ARCHIVE" | shasum -a 256 -c -
          tar -tf "$RUNNER_TEMP/$ORIGINAL_ARCHIVE" > "$RUNNER_TEMP/original-entries.txt"
          grep -qx 'ffmpeg' "$RUNNER_TEMP/original-entries.txt"
          grep -qx 'ffprobe' "$RUNNER_TEMP/original-entries.txt"
          test "$(wc -l < "$RUNNER_TEMP/original-entries.txt" | tr -d ' ')" = 2
          tar -xJf "$RUNNER_TEMP/$ORIGINAL_ARCHIVE" -C "$RUNNER_TEMP/original"
          SAMPLE_BYTES=$(( 12 * 1024 * 1024 / 188 * 188 ))
          SAMPLE_LAST=$(( SAMPLE_BYTES - 1 ))
          curl --fail --location --retry 2 --max-time 180 --range "0-$SAMPLE_LAST" "$TELE_TEXT_SAMPLE" \
            -o "$RUNNER_TEMP/fixture/teletext-prefix.ts"
          test "$(wc -c < "$RUNNER_TEMP/fixture/teletext-prefix.ts" | tr -d ' ')" = "$SAMPLE_BYTES"
          shasum -a 256 "$RUNNER_TEMP/fixture/teletext-prefix.ts" > "$RUNNER_TEMP/output/fixture.sha256"
          printf 'source_commit=%s\nzvbi_commit=%s\nfixture_url=%s\nfixture_bytes=%s\n' \
            "$FF_SOURCE_COMMIT" "$ZVBI_COMMIT" "$TELE_TEXT_SAMPLE" "$SAMPLE_BYTES" \
            > "$RUNNER_TEMP/output/source-facts.txt"
          printf 'original_archive=%s\noriginal_sha256=%s\narchitecture=%s\ntarget=%s\n' \
            "$ORIGINAL_ARCHIVE" "$ORIGINAL_SHA256" "$ARCH" "$TARGET" \
            >> "$RUNNER_TEMP/output/source-facts.txt"
          printf 'workflow_commit=%s\nworkflow_sha256=%s\nmacos_recipe_patch_sha256=%s\n' \
            "$GITHUB_SHA" "$WORKFLOW_SHA256" "$MACOS_DEPS_PATCH_SHA256" \
            >> "$RUNNER_TEMP/output/source-facts.txt"
          if [ "$ARCH" = x86_64 ]; then
            cp "$RUNNER_TEMP/output/homebrew-before.txt" \
              "$RUNNER_TEMP/output/homebrew-formula-info.json" \
              "$RUNNER_TEMP/output/homebrew-after.txt" \
              "$RUNNER_TEMP/output/homebrew-facts.sha256" \
              "$RUNNER_TEMP/output/sources/"
          fi
          printf 'name\tcommit-or-revision\tarchive\n' > "$RUNNER_TEMP/output/source-pins.tsv"
          printf 'jellyfin-ffmpeg\t%s\tsources/jellyfin-ffmpeg-v8.1.3-2.tar.gz\n' \
            "$FF_SOURCE_COMMIT" >> "$RUNNER_TEMP/output/source-pins.tsv"
          printf 'ffmpeg-subtitles-workflow\t%s\tsources/ffmpeg-subtitles.yml\n' \
            "$GITHUB_SHA" >> "$RUNNER_TEMP/output/source-pins.tsv"
          printf 'ffmpeg-macos-no-gcc-patch\t%s\tsources/ffmpeg-macos-no-gcc.patch\n' \
            "$GITHUB_SHA" >> "$RUNNER_TEMP/output/source-pins.tsv"
          if [ "$ARCH" = x86_64 ]; then
            printf 'homebrew-core\t%s\tsources/homebrew-after.txt\n' \
              "$HOMEBREW_CORE_COMMIT" >> "$RUNNER_TEMP/output/source-pins.tsv"
          fi
          shasum -a 256 "$RUNNER_TEMP/output/sources/jellyfin-ffmpeg-v8.1.3-2.tar.gz" \
            "$RUNNER_TEMP/output/sources/ffmpeg-builder-recipes.tar.gz" \
            "$RUNNER_TEMP/output/sources/ffmpeg-subtitles.yml" \
            > "$RUNNER_TEMP/output/sources.sha256"
          if [ "$ARCH" = x86_64 ]; then
            shasum -a 256 "$RUNNER_TEMP/output/sources/homebrew-before.txt" \
              "$RUNNER_TEMP/output/sources/homebrew-formula-info.json" \
              "$RUNNER_TEMP/output/sources/homebrew-after.txt" \
              "$RUNNER_TEMP/output/sources/homebrew-facts.sha256" \
              >> "$RUNNER_TEMP/output/sources.sha256"
          fi
      - name: Verify baseline GPL symbols and teletext subtitle decode
        run: |
          nm -g "$RUNNER_TEMP/original/ffmpeg" > "$RUNNER_TEMP/output/original-symbols.txt"
          grep -E 'vbi_decode_teletext_8301_cni|vbi_decode_teletext_8302_pdc' "$RUNNER_TEMP/output/original-symbols.txt"
          grep -E '(^| )_?vbi_decode$' "$RUNNER_TEMP/output/original-symbols.txt"
          "$RUNNER_TEMP/original/ffprobe" -v error -select_streams s -show_entries stream=index,codec_name \
            -of json "$RUNNER_TEMP/fixture/teletext-prefix.ts" > "$RUNNER_TEMP/output/original-streams.json"
          grep -q '"codec_name": "dvb_teletext"' "$RUNNER_TEMP/output/original-streams.json"
          "$RUNNER_TEMP/original/ffmpeg" -y -v error -txt_page subtitle -txt_format text \
            -i "$RUNNER_TEMP/fixture/teletext-prefix.ts" -map 0:s:0 -c:s srt -f srt \
            "$RUNNER_TEMP/output/original.srt"
          test -s "$RUNNER_TEMP/output/original.srt"
          grep -q -- '-->' "$RUNNER_TEMP/output/original.srt"
      - name: Apply pinned macOS and ZVBI source patches
        env:
          PATCH_FILE: ${{ github.workspace }}/apps/macos/ffmpeg-zvbi-subtitles-only.patch
          MACOS_DEPS_PATCH_FILE: ${{ github.workspace }}/apps/macos/ffmpeg-macos-no-gcc.patch
        run: |
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" apply --check "$MACOS_DEPS_PATCH_FILE"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" apply "$MACOS_DEPS_PATCH_FILE"
          cp "$MACOS_DEPS_PATCH_FILE" "$RUNNER_TEMP/output/sources/ffmpeg-macos-no-gcc.patch"
          cp "$RUNNER_TEMP/jellyfin-ffmpeg/builder/images/macos/00-dep.sh" \
            "$RUNNER_TEMP/output/sources/00-dep-no-gcc.sh"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" diff --no-index -- \
            <(git -C "$RUNNER_TEMP/jellyfin-ffmpeg" show "$FF_SOURCE_COMMIT:builder/images/macos/00-dep.sh") \
            "$RUNNER_TEMP/jellyfin-ffmpeg/builder/images/macos/00-dep.sh" \
            > "$RUNNER_TEMP/output/sources/macos-deps-injection.patch" || test "$?" -eq 1
          grep -qx 'SCRIPT_REPO="https://github.com/zapping-vbi/zvbi.git"' "$RUNNER_TEMP/jellyfin-ffmpeg/builder/scripts.d/50-zvbi.sh"
          grep -qx "SCRIPT_COMMIT=\"$ZVBI_COMMIT\"" "$RUNNER_TEMP/jellyfin-ffmpeg/builder/scripts.d/50-zvbi.sh"
          python3 - "$RUNNER_TEMP/jellyfin-ffmpeg/builder/scripts.d/50-zvbi.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          anchor = '    cd zvbi\n\n    ./autogen.sh\n'
          replacement = '    cd zvbi\n\n    git apply --check "$PATCH_FILE"\n    git apply "$PATCH_FILE"\n\n    ./autogen.sh\n'
          if text.count(anchor) != 1:
              raise SystemExit("Pinned upstream zvbi build anchor changed")
          path.write_text(text.replace(anchor, replacement))
          PY
          cp "$PATCH_FILE" "$RUNNER_TEMP/output/sources/ffmpeg-zvbi-subtitles-only.patch"
          cp "$RUNNER_TEMP/jellyfin-ffmpeg/builder/scripts.d/50-zvbi.sh" "$RUNNER_TEMP/output/sources/50-zvbi.sh"
          git -C "$RUNNER_TEMP/jellyfin-ffmpeg" diff --no-index -- \
            <(git -C "$RUNNER_TEMP/jellyfin-ffmpeg" show "$FF_SOURCE_COMMIT:builder/scripts.d/50-zvbi.sh") \
            "$RUNNER_TEMP/jellyfin-ffmpeg/builder/scripts.d/50-zvbi.sh" \
            > "$RUNNER_TEMP/output/sources/build-script-injection.patch" || test "$?" -eq 1
          shasum -a 256 "$RUNNER_TEMP/output/sources/ffmpeg-zvbi-subtitles-only.patch" \
            "$RUNNER_TEMP/output/sources/50-zvbi.sh" \
            "$RUNNER_TEMP/output/sources/build-script-injection.patch" \
            "$RUNNER_TEMP/output/sources/ffmpeg-macos-no-gcc.patch" \
            "$RUNNER_TEMP/output/sources/00-dep-no-gcc.sh" \
            "$RUNNER_TEMP/output/sources/macos-deps-injection.patch" \
            "$RUNNER_TEMP/output/sources/upstream-meta-mac-portable.yaml" \
            "$RUNNER_TEMP/output/sources/Buildmac.md" >> "$RUNNER_TEMP/output/sources.sha256"
      - name: Build using upstream macOS recipe
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          cd "$RUNNER_TEMP/jellyfin-ffmpeg"
          export PATCH_FILE="$GITHUB_WORKSPACE/apps/macos/ffmpeg-zvbi-subtitles-only.patch"
          ./builder/buildmac.sh "$ARCH" 2>&1 | tee "$RUNNER_TEMP/output/build.log"
          test -s builder/artifacts/jellyfin-ffmpeg_8.1.3-2_portable_${TARGET}-gpl.tar.xz
          cp builder/artifacts/jellyfin-ffmpeg_8.1.3-2_portable_${TARGET}-gpl.tar.xz "$RUNNER_TEMP/output/"
          tar -xJf "$RUNNER_TEMP/output/jellyfin-ffmpeg_8.1.3-2_portable_${TARGET}-gpl.tar.xz" \
            -C "$RUNNER_TEMP/output" ffmpeg ffprobe
          {
            printf 'HOMEBREW_NO_AUTO_UPDATE=1\nHOMEBREW_NO_INSTALL_UPGRADE=1\n'
            xcodebuild -version
            clang --version | head -n 1
            clang++ --version | head -n 1
            g++ --version | head -n 1
            cmake --version | head -n 1
            brew list --versions cmake gcc gcc@15 2>/dev/null || true
          } > "$RUNNER_TEMP/output/toolchain-facts.txt"
      - name: Verify patched symbols and subtitle text and timing
        run: |
          nm -g "$RUNNER_TEMP/output/ffmpeg" > "$RUNNER_TEMP/output/patched-symbols.txt"
          if grep -E 'vbi_decode_teletext_830|_?vbi_(pil|pty|program_id|mktime|timegm)' \
            "$RUNNER_TEMP/output/patched-symbols.txt"; then
            echo 'Removed GPLv2-only ZVBI symbols remain in the patched executable' >&2
            exit 1
          fi
          grep -E '(^| )_?vbi_decode$' "$RUNNER_TEMP/output/patched-symbols.txt"
          "$RUNNER_TEMP/output/ffprobe" -v error -select_streams s -show_entries stream=index,codec_name \
            -of json "$RUNNER_TEMP/fixture/teletext-prefix.ts" > "$RUNNER_TEMP/output/patched-streams.json"
          grep -q '"codec_name": "dvb_teletext"' "$RUNNER_TEMP/output/patched-streams.json"
          "$RUNNER_TEMP/output/ffmpeg" -y -v error -txt_page subtitle -txt_format text \
            -i "$RUNNER_TEMP/fixture/teletext-prefix.ts" -map 0:s:0 -c:s srt -f srt \
            "$RUNNER_TEMP/output/patched.srt"
          test -s "$RUNNER_TEMP/output/patched.srt"
          grep -q -- '-->' "$RUNNER_TEMP/output/patched.srt"
          diff -u "$RUNNER_TEMP/output/original.srt" "$RUNNER_TEMP/output/patched.srt"
          printf 'cue_count=%s\n' "$(grep -c -- '-->' "$RUNNER_TEMP/output/patched.srt")" \
            > "$RUNNER_TEMP/output/subtitle-summary.txt"
          shasum -a 256 "$RUNNER_TEMP/output/ffmpeg" "$RUNNER_TEMP/output/ffprobe" > "$RUNNER_TEMP/output/binaries.sha256"
      - name: Retain dependency source corresponding to the build
        run: |
          dependency_count=0
          for source in "$RUNNER_TEMP/jellyfin-ffmpeg"/builder/build/*; do
            test -d "$source" || continue
            dependency_count=$((dependency_count + 1))
            name="$(basename "$source")"
            commit=
            revision=
            if [ -e "$source/.git" ]; then
              test "$(git -C "$source" rev-parse --show-toplevel)" = "$source"
              commit="$(git -C "$source" rev-parse HEAD)"
              git -C "$source" diff HEAD --binary > "$RUNNER_TEMP/output/sources/dependencies/$name-$commit.patch"
            elif [ -d "$source/.svn" ]; then
              revision="$(svn info --show-item revision "$source")"
              svn diff "$source" > "$RUNNER_TEMP/output/sources/dependencies/$name-r$revision.patch"
            else
              revision=extracted-source-tree
            fi
            case "${revision:-}" in
              r*) archive="$name-$revision" ;;
              *) archive="$name-${commit:-$revision}" ;;
            esac
            tar -czf "$RUNNER_TEMP/output/sources/dependencies/$archive.tar.gz" \
              --exclude='.git' --exclude='.svn' --exclude='.libs' --exclude='autom4te.cache' \
              --exclude='*.o' --exclude='*.lo' --exclude='*.la' --exclude='*.a' \
              --exclude='*.dylib' --exclude='*.so' --exclude='*.dSYM' -C "$source" .
            printf '%s\t%s\tsources/dependencies/%s.tar.gz\n' "$name" \
              "${commit:-$revision}" "$archive" >> "$RUNNER_TEMP/output/source-pins.tsv"
            shasum -a 256 "$RUNNER_TEMP/output/sources/dependencies/$archive.tar.gz" \
              >> "$RUNNER_TEMP/output/sources.sha256"
          done
          test "$dependency_count" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-teletext-${{ matrix.arch }}
          path: ${{ runner.temp }}/output
          retention-days: 30
