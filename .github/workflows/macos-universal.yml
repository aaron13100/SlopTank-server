name: SlopTank JXA harness diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jxa-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Compare current-application and language delay calls
        run: |
          sw_vers
          /usr/bin/osascript -l JavaScript <<'JXA'
          function sample(name, action) {
              var started = Date.now();
              try {
                  action();
                  console.log(JSON.stringify({ operation: name, ok: true,
                      elapsedMs: Date.now() - started }));
              } catch (error) {
                  console.log(JSON.stringify({ operation: name, ok: false,
                      number: error.number, code: error.code, message: String(error),
                      stack: error.stack, elapsedMs: Date.now() - started }));
              }
          }
          var current = Application.currentApplication();
          current.includeStandardAdditions = true;
          sample("current.delay", function () { current.delay(0.2); });
          sample("global delay", function () { delay(0.2); });
          JXA
