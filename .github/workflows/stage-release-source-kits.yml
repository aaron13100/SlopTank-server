# SlopTank modification notice: added or changed by SlopTank on 2026-11-14.
name: Stage release corresponding-source kits

on:
  push:
    branches:
      - release-sourcekit-relay-20261114
    paths:
      - .github/workflows/stage-release-source-kits.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful source-kit producer run ID
        required: true
        type: string
      source_commit:
        description: Exact 40-character producer source commit
        required: true
        type: string
      release_id:
        description: Existing private draft release ID
        required: true
        type: string
      version:
        description: Release version, without the v prefix
        required: true
        type: string
      ffmpeg_sha256:
        description: Expected SHA-256 of the FFmpeg corresponding-source archive
        required: true
        type: string
      preparation_sha256:
        description: Expected SHA-256 of the preparation corresponding-source archive
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '43621230231' }}
      SOURCE_COMMIT: ${{ inputs.source_commit || '2b8dbf20a0de04d36fb589d15a799622df1fc19e' }}
      RELEASE_ID: ${{ inputs.release_id || '443269787' }}
      RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
      FFMPEG_SHA256: ${{ inputs.ffmpeg_sha256 || '5544e96e76cc896c290aeede60116b5cfa15347905ca52d5fb9df92f07de1f31' }}
      PREPARATION_SHA256: ${{ inputs.preparation_sha256 || 'fa62ba44dca06e83ffdd4937d5e4c756531119169800df59d207226502469345' }}
      RECEIPT_DIR: ${{ github.workspace }}/source-kit-relay/receipts
      STAGE_DIR: ${{ github.workspace }}/source-kit-relay/stage
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and guard producer run and private draft
        shell: bash
        run: |
          mkdir -p "$RECEIPT_DIR"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          receipt = Path(os.environ['RECEIPT_DIR']) / 'receipt.jsonl'

          def record(event, **values):
              with receipt.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps({'event': event, **values}, sort_keys=True) + '\n')

          def safe_context(value):
              value = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1?<redacted>', value)
              token = os.environ.get('GH_TOKEN', '')
              return value.replace(token, '<redacted>') if token else value

          def gh_json(args):
              result = subprocess.run(['gh', 'api', *args], text=True, capture_output=True)
              if result.returncode:
                  record('github_api_error', command='gh api ' + ' '.join(args), exit_code=result.returncode,
                         stdout=safe_context(result.stdout[-4000:]), stderr=safe_context(result.stderr[-4000:]))
                  raise RuntimeError('GitHub API request failed; see relay receipt')
              return json.loads(result.stdout)

          try:
              values = {key: os.environ[key] for key in (
                  'SOURCE_RUN_ID', 'SOURCE_COMMIT', 'RELEASE_ID', 'RELEASE_VERSION',
                  'FFMPEG_SHA256', 'PREPARATION_SHA256', 'GH_REPO')}
              if not re.fullmatch(r'[1-9][0-9]*', values['SOURCE_RUN_ID']):
                  raise ValueError('source_run_id must be a positive decimal ID')
              if not re.fullmatch(r'[1-9][0-9]*', values['RELEASE_ID']):
                  raise ValueError('release_id must be a positive decimal ID')
              if not re.fullmatch(r'[0-9a-fA-F]{40}', values['SOURCE_COMMIT']):
                  raise ValueError('source_commit must be 40 hexadecimal characters')
              if not re.fullmatch(r'[0-9a-fA-F]{64}', values['FFMPEG_SHA256']):
                  raise ValueError('ffmpeg_sha256 must be 64 hexadecimal characters')
              if not re.fullmatch(r'[0-9a-fA-F]{64}', values['PREPARATION_SHA256']):
                  raise ValueError('preparation_sha256 must be 64 hexadecimal characters')
              if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', values['RELEASE_VERSION']):
                  raise ValueError('version must be a simple semantic version such as 0.1.0')

              run = gh_json([f"repos/{values['GH_REPO']}/actions/runs/{values['SOURCE_RUN_ID']}"])
              run_repo = (run.get('repository') or {}).get('full_name')
              if run_repo != values['GH_REPO'] or run.get('head_sha', '').lower() != values['SOURCE_COMMIT'].lower():
                  raise ValueError('producer run repository or head_sha does not match the requested source')

              release = gh_json([f"repos/{values['GH_REPO']}/releases/{values['RELEASE_ID']}"])
              if (release.get('id') != int(values['RELEASE_ID']) or release.get('draft') is not True
                      or release.get('tag_name') != 'v' + values['RELEASE_VERSION']):
                  raise ValueError('release must be the requested private draft with the exact version tag')
              record('preflight_passed', requested_source_run_id=values['SOURCE_RUN_ID'],
                     producer_run_id=run.get('id'), producer_repository=run_repo,
                     producer_ref=run.get('head_branch'),
                     requested_source_commit=values['SOURCE_COMMIT'].lower(), actual_source_commit=run['head_sha'],
                     requested_release_id=values['RELEASE_ID'], actual_release_id=release['id'],
                     release_tag=release['tag_name'], draft=release['draft'],
                     runner_validation='GitHub Actions ubuntu-latest')
          except Exception as error:
              record('preflight_failed', error=f'{type(error).__name__}: {error}')
              raise
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-corresponding-source-kit
          path: ${{ env.STAGE_DIR }}/ffmpeg
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '43621230231' }}

      - uses: actions/download-artifact@v4
        with:
          name: preparation-corresponding-source-kit
          path: ${{ env.STAGE_DIR }}/preparation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '43621230231' }}

      - name: Validate both archives and prepare exact upload files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import posixpath
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['STAGE_DIR'])
          receipt = Path(os.environ['RECEIPT_DIR']) / 'receipt.jsonl'
          root.mkdir(parents=True, exist_ok=True)

          def record(event, **values):
              with receipt.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps({'event': event, **values}, sort_keys=True) + '\n')

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def safe_name(name):
              path = PurePosixPath(name)
              if not name or '\\' in name or path.is_absolute() or '..' in path.parts:
                  raise ValueError(f'unsafe archive member path: {name!r}')
              normalized = posixpath.normpath(name)
              if normalized in ('', '.', '..') or normalized.startswith('../'):
                  raise ValueError(f'unsafe archive member path: {name!r}')
              return normalized

          def safe_link(member):
              target = member.linkname
              if not target or '\\' in target or PurePosixPath(target).is_absolute():
                  raise ValueError(f'unsafe link target: {member.name!r} -> {target!r}')
              base = posixpath.dirname(member.name) if member.issym() else ''
              resolved = posixpath.normpath(posixpath.join(base, target))
              if resolved == '..' or resolved.startswith('../') or resolved.startswith('/'):
                  raise ValueError(f'link target escapes archive root: {member.name!r} -> {target!r}')

          specs = (
              ('ffmpeg', f"SlopTank-{os.environ['RELEASE_VERSION']}-ffmpeg-corresponding-source.tar.gz",
               os.environ['FFMPEG_SHA256'].lower()),
              ('preparation', f"SlopTank-{os.environ['RELEASE_VERSION']}-preparation-corresponding-source.tar.gz",
               os.environ['PREPARATION_SHA256'].lower()),
          )
          errors = []
          for folder, filename, expected in specs:
              directory = root / folder
              path = directory / filename
              try:
                  entries = list(directory.iterdir())
                  if len(entries) != 1 or entries[0] != path or not path.is_file() or path.is_symlink():
                      raise ValueError(f'{folder} artifact must contain only {filename}')
                  actual = sha256(path)
                  if actual != expected:
                      raise ValueError(f'{folder} archive SHA-256 differs from requested value')
                  members = []
                  with tarfile.open(path, mode='r:gz') as archive:
                      for member in archive:
                          safe_name(member.name)
                          if member.issym() or member.islnk():
                              safe_link(member)
                          elif not (member.isfile() or member.isdir()):
                              raise ValueError(f'unsupported special archive member: {member.name!r}')
                          members.append({'name': member.name, 'type': 'link' if member.issym() or member.islnk()
                                          else 'file' if member.isfile() else 'directory', 'size': member.size})
                  if not members:
                      raise ValueError(f'{folder} archive is empty')
                  staged = root / filename
                  path.replace(staged)
                  checksum = root / f'{filename}.sha256'
                  checksum.write_text(f'{actual}  {filename}\n', encoding='ascii')
                  record('archive_validated', filename=filename, sha256=actual, size=staged.stat().st_size,
                         member_count=len(members), members=members)
              except Exception as error:
                  errors.append(f'{folder}: {type(error).__name__}: {error}')
                  record('archive_validation_failed', filename=filename,
                         error=f'{type(error).__name__}: {error}')
          if errors:
              raise RuntimeError('archive validation failed: ' + '; '.join(errors))
          record('all_archives_validated', upload_file_count=4)
          PY

      - name: Stage only corresponding-source assets on the private draft
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          stage = Path(os.environ['STAGE_DIR'])
          receipt = Path(os.environ['RECEIPT_DIR']) / 'receipt.jsonl'

          def record(event, **values):
              with receipt.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps({'event': event, **values}, sort_keys=True) + '\n')

          def safe_context(value):
              value = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1?<redacted>', value)
              token = os.environ.get('GH_TOKEN', '')
              return value.replace(token, '<redacted>') if token else value

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def gh_json(args):
              result = subprocess.run(['gh', 'api', *args], text=True, capture_output=True)
              if result.returncode:
                  record('github_api_error', command='gh api ' + ' '.join(args), exit_code=result.returncode,
                         stdout=safe_context(result.stdout[-4000:]), stderr=safe_context(result.stderr[-4000:]))
                  raise RuntimeError('GitHub API request failed; see relay receipt')
              return json.loads(result.stdout)

          repo = os.environ['GH_REPO']
          release_id = os.environ['RELEASE_ID']
          tag = 'v' + os.environ['RELEASE_VERSION']

          def ensure_private_draft():
              release = gh_json([f'repos/{repo}/releases/{release_id}'])
              if release.get('id') != int(release_id) or release.get('draft') is not True or release.get('tag_name') != tag:
                  raise RuntimeError('draft guard failed before asset mutation')
              return release

          release = ensure_private_draft()
          assets = gh_json([f'repos/{repo}/releases/{release_id}/assets?per_page=100'])
          names = [f"SlopTank-{os.environ['RELEASE_VERSION']}-ffmpeg-corresponding-source.tar.gz",
                   f"SlopTank-{os.environ['RELEASE_VERSION']}-ffmpeg-corresponding-source.tar.gz.sha256",
                   f"SlopTank-{os.environ['RELEASE_VERSION']}-preparation-corresponding-source.tar.gz",
                   f"SlopTank-{os.environ['RELEASE_VERSION']}-preparation-corresponding-source.tar.gz.sha256"]
          for name in names:
              path = stage / name
              local_hash = sha256(path)
              local_size = path.stat().st_size
              matching = [asset for asset in assets if asset.get('name') == name]
              existing = matching[-1] if matching else None
              if (existing and existing.get('state') == 'uploaded'
                      and existing.get('digest') == 'sha256:' + local_hash
                      and existing.get('size') == local_size):
                  record('asset_reused', filename=name, asset_id=existing.get('id'), digest=existing.get('digest'),
                         size=existing.get('size'), status='already-matching')
                  continue

              ensure_private_draft()
              command = ['gh', 'release', 'upload', tag, str(path), '--repo', repo, '--clobber']
              result = subprocess.run(command, text=True, capture_output=True)
              record('asset_upload_command', filename=name, exit_code=result.returncode,
                     stdout=safe_context(result.stdout[-4000:]), stderr=safe_context(result.stderr[-4000:]))
              if result.returncode:
                  raise RuntimeError(f'upload failed for {name}; see relay receipt')

              assets = gh_json([f'repos/{repo}/releases/{release_id}/assets?per_page=100'])
              uploaded = [asset for asset in assets if asset.get('name') == name]
              verified = uploaded[-1] if uploaded else None
              if (not verified or verified.get('state') != 'uploaded'
                      or verified.get('digest') != 'sha256:' + local_hash
                      or verified.get('size') != local_size):
                  record('asset_verification_failed', filename=name, expected_digest='sha256:' + local_hash,
                         expected_size=local_size,
                         observed={key: verified.get(key) for key in ('id', 'name', 'state', 'digest', 'size')}
                         if verified else None)
                  raise RuntimeError(f'GitHub asset digest or size mismatch for {name}')
              record('asset_staged', filename=name, asset_id=verified.get('id'), digest=verified.get('digest'),
                     size=verified.get('size'), status='uploaded-and-verified')
          record('staging_complete', release_id=release['id'], release_tag=tag, draft=True,
                 runner_validation='GitHub Actions ubuntu-latest')
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: source-kit-relay-receipt-${{ github.run_id }}
          path: ${{ env.RECEIPT_DIR }}/receipt.jsonl
          if-no-files-found: warn
          retention-days: 7
